[build-system]
requires = ["setuptools", "wheel", "numpy"]
build-backend = "setuptools.build_meta"


[project]
dynamic = ["version"]
name = 'pogos'
authors = [
    {name = 'Neil Cook', email = 'neil.james.cook@gmail.com'},
]
description = 'Processing General Observations - A wrapper for PAKORA, SOSSISSE and SORBET'
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = 'LICENSE'}
requires-python = "==3.11.*"
dependencies = [
        "radvel==1.4.11",
        "juliet==2.2.7",
        "jwst==1.16.1",
        "numpy==1.24.3",
        "astropy==7.0.1",
        "corner==2.2.3",
        "scipy==1.10.1",
        "matplotlib==3.10.0",
        "tqdm==4.67.1",
        "h5py==3.13.0",
        "ruamel.yaml==0.18.10",
        "wpca==0.1",
        "scikit-image==0.24.0",
        "scikit-learn==1.6.1",
        "statsmodels==0.14.4",
]

[project.urls]
Homepage = 'http://apero.exoplanets.ca'
Repository = 'https://github.com/njcuk9999/{module}'

[project.scripts]
pogos_setup = "pogos:recipes.pogos_setup.run"
pogos_run = "pogos:recipes.pogos_run.run"

[project.optional-dependencies]
full = ["aperocore @ git+https://github.com/njcuk9999/apero-drs.git@v0.8.003#subdirectory=apero-core",
        "sossisse @ git+https://github.com/njcuk9999/sossisse.git"]
dev = ["aperocore", "sossisse"]