[build-system]
requires = ["setuptools", "wheel", "numpy"]
build-backend = "setuptools.build_meta"


[project]
dynamic = ["version"]
name = 'pogos'
authors = [
    {name = 'Neil Cook', email = 'neil.james.cook@gmail.com'},
]
description = 'Processing General Observations - A wrapper for TSOVORE, SOSSISSE and SORBET'
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = 'LICENSE'}
requires-python = "==3.12.*"
dependencies = [
        "juliet==2.2.10",
        "jwst==2.0.1",
        # "crds==12.1.1",
        "numpy==2.3.3",
        "astropy==7.2.0",
        "corner==2.2.3",
        # batman-package on PyPI uses NPY_1_7_API_VERSION which breaks numpy 2.x on macOS.
        # PR#70 fixed this (NPY_2_0_API_VERSION) but was never released to PyPI.
        # Pin to the post-fix commit until a new PyPI release is made.
        "batman-package @ git+https://github.com/lkreidberg/batman.git@3c69c4381d9785cd4d06e898c2cdf83b22ffb365",

        "ipython==8.32.0",
        "scipy==1.17.0",
        "matplotlib==3.10.8",
        "notebook==7.5.4",
        "prompt_toolkit==3.0.50",
        "tqdm==4.67.3",
        "h5py==3.15.1",
        "ruamel.yaml==0.19.1",
        "wpca==0.1",
        "scikit-image==0.26.0",
        "scikit-learn==1.8.0",
        "statsmodels==0.14.6",
        "astraeus-io @ git+https://github.com/kevin218/Astraeus.git"
]

[project.urls]
Homepage = 'http://apero.exoplanets.ca'
Repository = 'https://github.com/njcuk9999/{module}'

[project.scripts]
pogos_setup = "pogos.recipes.pogos_setup:run"
pogos_run = "pogos.recipes.pogos_run:run"
pogos_copy = "pogos.recipes.pogos_copy:run"

[project.optional-dependencies]
full = ["aperocore @ git+https://github.com/njcuk9999/apero-drs.git@v0.8.running#subdirectory=apero-core",
        # fleck required until updated to support numpy 2.x
        "fleck @ git+https://github.com/njcuk9999/fleck.git",
        # eureka miri_firstframe deals with exotic-ld and pastasoss dependencies with numpy 2.x
        "eureka-bang @ git+https://github.com/kevin218/Eureka.git@miri_firstframe",
        "sossisse @ git+https://github.com/njcuk9999/sossisse.git@developer"]
# dev assumes you are installing aperocore, fleck, eureka and sossisse in editable mode and so does not install them
dev = ["pytest>=8.0"]
