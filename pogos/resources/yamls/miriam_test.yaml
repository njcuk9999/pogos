#############################################################################
# POGOS
#############################################################################
#     Version = 0.0.020
#     Date    = 2025-10-16

# If using a different version it is recommended to
# run pogos_setup.py to generate a new yaml file.


# =============================================================================
# global settings (generally don't touch these)
# =============================================================================
GLOBAL:
  # The data directory (required)
  #         Default value=None
  DATA_PATH: /scratch3/jwst/pogos-data/data
  # Instrument mode e.g. one of the following: JWST.NIRISS.SOSS
  #         JWST.NIRISS.FGS
  #         JWST.NIRSPEC.PRISM
  #         JWST.NIRSPEC.G395
  #         JWST.NIRSPEC.G253
  #         JWST.NIRSPEC.G140
  #         JWST.MIRI.IMAGING
  #         Default value=None
  INSTRUMENTMODE: JWST.MIRI.IMAGING


# =============================================================================
# Switches to turn on major features
# =============================================================================
RUN:
  # Run TSOVORE
  #         Default value=None
  TSOVORE: false
  # Run SOSSISSE
  #         Default value=None
  SOSSISSE: false
  # Run MIRIAM
  #         Default value=None
  MIRIAM: true
  # Run SORBET
  #         Default value=None
  SORBET: false


# =============================================================================
# #############################################################################
# MIRIAM: MIRI Image Analysis Module
# #############################################################################
#     Version = 0.0.001
#     Date    = 2025-01-31


# =============================================================================
MIRIAM:


  # =============================================================================
  # General configs for SORBET
  # =============================================================================
  GENERAL:
    # A string ID for the observation (used for default paths etc)
    #         Default value=None
    SID: DEMO-LHS-1140-MIRIAM-20240707
    # Description of the MIRIAM run
    #         Default value=
    DESCRIPTION: LHS-1140 eclipse observed on 2024-07-07


  # =============================================================================
  # Definition of inputs related to plots
  # =============================================================================
  PLOTS:
    # Or you can use the following to always show plots regardless of the username
    #         Default value=False
    SHOW: true
    # output(s) type of figure
    #         Default value=['png', 'pdf']
    FIGURE_TYPES:
    - png
    - pdf


  # =============================================================================
  # Definition of inputs related to the data
  # =============================================================================
  INPUTS:
    # List of files to be processed in form:
    # FILES:
    #  - file1
    #  - file2
    #  - file3

    # By default these should be placed in {GLOBAL.DATA_PATH}/{MIRIAM.PATHS.INTPUT_PATH}/
    #  or whatever is set in {MIRIAM.PATHS.INTPUT_PATH} (if absolute)
    #         Default value=None
    FILES:
    - jw03730009001_03101_00001-seg001_mirimage_calints.fits
    - jw03730009001_03101_00001-seg002_mirimage_calints.fits
    - jw03730009001_03101_00001-seg003_mirimage_calints.fits
    - jw03730009001_03101_00001-seg004_mirimage_calints.fits
    - jw03730009001_03101_00001-seg005_mirimage_calints.fits
    # List of integrations to skip (0-indexed)
    #         Default value=None
    SKIP_INTEGRATIONS:
      - 0
      - 1

    # don't use old data
    USE_PREVIOUS_MERGED_DATA: false